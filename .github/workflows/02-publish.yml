
name: "02 — Одобри и публикувай (ръчно)"

on:
  workflow_dispatch:
    inputs:
      preview_run_id:
        description: "Номер на успешната проверка (Run ID)"
        required: true
        type: string

permissions:
  actions: read
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest

    steps:
      - name: Изтегли файловете на проекта
        uses: actions/checkout@v4
        with:
          persist-credentials: true

      - name: Изтегли предварително проверения каталог
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_ID: ${{ inputs.preview_run_id }}
          GH_REPO: ${{ github.repository }}
        run: |
          case "$RUN_ID" in
            *[!0-9]*|'')
              echo "Невалиден Run ID"
              exit 1
              ;;
          esac

          gh run download "$RUN_ID" \
            --name angel-smart-preview \
            --dir preview

      - name: Настрой Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Провери одобрения каталог
        run: node scripts/publish-approved.mjs

      - name: Публикувай каталога
        run: |
          git config user.name "angel-smart-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add music-catalog.json

          if git diff --cached --quiet; then
            echo "Няма промени за публикуване."
          else
            git commit -m "ANGEL SMART: ръчно одобрен каталог"
            git push
          fi
