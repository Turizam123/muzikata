name: "03 — Диагностика народни песни (без публикуване)"
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Провери всяка позиция в народния плейлист
        env:
          YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
        run: node scripts/diagnose-folk.mjs
      - uses: actions/upload-artifact@v4
        with:
          name: angel-smart-diagnostika
          path: diagnostics/
          retention-days: 30
