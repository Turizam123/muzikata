function loadSong(i){current=i;queuePos=queue.indexOf(i);const s=songs[i];$('nowTitle').textContent=s.title;$('youtubeLink').href='https://www.youtube.com/watch?v='+s.id;if(apiReady&&window.YT&&YT.Player){if(!player){player=new YT.Player('player',{width:'100%',height:'100%',videoId:s.id,playerVars:{playsinline:1,rel:0,origin:location.protocol.startsWith('http')?location.origin:undefined},events:{onStateChange:onStateChange,onError:onPlayerError}})}else{player.loadVideoById(s.id)}}else{const holder=$('player');holder.replaceChildren();const f=element('iframe');f.src='https://www.youtube-nocookie.com/embed/'+s.id+'?autoplay=1&rel=0';f.title=s.title;f.allow='accelerometer; autoplay; encrypted-media; gyroscope; picture-in-picture; fullscreen';f.allowFullscreen=true;f.style.cssText='width:100%;height:100%;border:0';holder.append(f)}}
function onStateChange(e){if(e.data===YT.PlayerState.ENDED&&live)nextSong()}

$('fullscreen').onclick=requestCinemaFullscreen;$('overlay').addEventListener('mousemove',revealControls);$('overlay').addEventListener('pointerdown',revealControls);$('overlay').addEventListener('focusin',revealControls);$('closePlayer').onclick=closePlayer;$('prev').onclick=prevSong;$('next').onclick=nextSong;$('mode').onclick=()=>setMode(!live);$('toggle').onclick=()=>{if(player&&YT?.PlayerState){let state=player.getPlayerState();state===YT.PlayerState.PLAYING?player.pauseVideo():player.playVideo()}else{$('toggle').textContent='Използвай контролите на YouTube'}};
$('heroLive').onclick=()=>openPlayer(0,true);$('liveNav').onclick=()=>openPlayer(0,true);$('homeNav').onclick=()=>{window.scrollTo({top:0,behavior:'smooth'});$('heroPlay').focus()};$('searchNav').onclick=()=>{$('searchPanel').classList.toggle('show');if($('searchPanel').classList.contains('show'))$('search').focus();else{ $('search').value='';draw() }};$('search').addEventListener('input',e=>draw(e.target.value));
document.addEventListener('keydown',e=>{
 const open=$('overlay').classList.contains('open');
 if(open){
  if(['Escape','Backspace','BrowserBack','GoBack'].includes(e.key)){
   e.preventDefault();if(document.fullscreenElement){document.exitFullscreen().catch(()=>{});revealControls()}else closePlayer();return;
  }
  if(e.code==='Space'||e.key==='MediaPlayPause'){e.preventDefault();$('toggle').click();revealControls();return}
  if(e.key==='MediaTrackNext'){e.preventDefault();nextSong();revealControls();return}
  if(e.key==='MediaTrackPrevious'){e.preventDefault();prevSong();revealControls();return}
  if(['ArrowLeft','ArrowRight','ArrowUp','ArrowDown'].includes(e.key)){
   e.preventDefault();revealControls();
   const controls=[...$('overlay').querySelectorAll('.player-top button,.player-bottom button,.player-bottom a')];
   let index=controls.indexOf(document.activeElement);
   if(index<0)index=1;
   else if(e.key==='ArrowRight'||e.key==='ArrowDown')index=(index+1)%controls.length;
   else index=(index-1+controls.length)%controls.length;
   controls[index].focus({preventScroll:true});return;
  }
  if(e.key==='Enter'){revealControls();if(document.activeElement===document.body){e.preventDefault();$('toggle').click()}return}
  revealControls();return;
 }
 if(e.target.tagName==='INPUT')return;
 const keys=['ArrowLeft','ArrowRight','ArrowUp','ArrowDown'];if(!keys.includes(e.key))return;
 const focusables=[...document.querySelectorAll('header button,header a,.hero-actions button,.tile,footer a')].filter(x=>x.getClientRects().length);
 const idx=focusables.indexOf(document.activeElement);if(idx<0)return;
 const rect=document.activeElement.getBoundingClientRect();const cx=rect.left+rect.width/2,cy=rect.top+rect.height/2;
 let best=null,score=Infinity;
 for(const x of focusables){if(x===document.activeElement)continue;const r=x.getBoundingClientRect(),dx=r.left+r.width/2-cx,dy=r.top+r.height/2-cy;
 const horizontal=e.key==='ArrowRight'||e.key==='ArrowLeft';
 if(e.key==='ArrowRight'&&dx<=15||e.key==='ArrowLeft'&&dx>=-15||e.key==='ArrowDown'&&dy<=15||e.key==='ArrowUp'&&dy>=-15)continue;
 let primary=horizontal?Math.abs(dx):Math.abs(dy),secondary=horizontal?Math.abs(dy):Math.abs(dx),value=primary+secondary*2.5;
 if(value<score){score=value;best=x}}
 if(best){e.preventDefault();best.focus();best.scrollIntoView({block:'nearest',inline:'nearest',behavior:'smooth'})}
});
